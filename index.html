<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صدقة جارية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
body{background:#000;color:#fff;text-align:center;font-family:'Amiri',serif;margin:0}
#box{padding:20px}
canvas{width:100%;max-width:400px;border-radius:12px}
button{background:#27ae60;color:#fff;padding:15px 30px;border:none;border-radius:10px;font-size:20px;margin:10px}
select{padding:10px;font-size:18px;border-radius:8px}
</style>
</head>
<body>
<div id="box">
<h2>🌙 صدقة جارية - صانع الصور القرآنية</h2>
<select id="sura">
<option value="113">سورة الفلق</option>
<option value="112">الإخلاص</option>
<option value="114">الناس</option>
<option value="1">الفاتحة</option>
<option value="36">يس</option>
</select>
<br><br>
<canvas id="c" width="1080" height="1920"></canvas>
<br>
<button onclick="make()">تحديث الصورة</button>
<button onclick="share()">مشاركة واتساب 📤</button>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let txt="قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ";
function draw(){
 const img=new Image(); img.crossOrigin="anonymous";
 img.src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1080";
 img.onload=()=>{
  ctx.drawImage(img,0,0,1080,1920);
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(0,0,1080,1920);
  ctx.fillStyle="#fff"; ctx.textAlign="center";
  ctx.font="bold 70px Amiri"; ctx.fillText(txt,540,900,900);
  ctx.font="40px Amiri"; ctx.fillStyle="#FFD700";
  ctx.fillText("صدقة جارية - زالنجي",540,1100);
 }
}
function make(){
 const s=document.getElementById('sura');
 txt=s.options[s.selectedIndex].text+" - "+new Date().toLocaleDateString('ar');
 draw();
}
function share(){
 canvas.toBlob(b=>{
  const f=new File([b],"quran.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"صدقة جارية"})}else{
   const a=document.createElement('a'); a.download="quran.png"; a.href=canvas.toDataURL(); a.click();
  }
 });
}
draw();
</script>
</body>
</html>
