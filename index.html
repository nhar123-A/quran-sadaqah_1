<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>صدقة جارية - من نهار - انكاء</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000!important;color:#fff;font-family:'Amiri',serif;text-align:center}
.card{max-width:360px;margin:20px auto;background:#0a0a0a;border:2px solid #FFD700;border-radius:20px;padding:25px 15px}
.aya{font-size:34px;line-height:2.1;color:#fff!important}
.sura{color:#FFD700;font-size:22px;margin:10px}
.duaa{color:#FFD700;font-size:15px;margin-top:12px;border-top:1px solid #333;padding-top:10px}
button{padding:13px 20px;border:none;border-radius:12px;margin:6px;font-weight:bold;font-size:15px;cursor:pointer}
select,input{width:92%;max-width:360px;padding:12px;border-radius:10px;margin:6px;background:#1a1a1a;color:#fff;border:1px solid #444;font-family:'Amiri',serif}
</style>
</head>
<body>
<h2 style="color:#FFD700;margin:15px 0">🕌 صدقة جارية - من نهار - انكاء</h2>
<p style="color:#aaa;font-size:12px">37 زائر - نسخة خفيفة بدون تشويش</p>

<select id="sura"></select><br>
<input id="duaa" value="اللهم اغفر لنهار ولوالديه وارحمهما"><br>

<div class="card">
<div style="font-size:45px">📖</div>
<div id="aya" class="aya">قُلْ هُوَ اللَّهُ أَحَدٌ</div>
<div id="suraName" class="sura">سورة الإخلاص</div>
<div id="duaaShow" class="duaa">اللهم اغفر لنهار ولوالديه وارحمهما</div>
<div style="color:#666;font-size:11px;margin-top:10px">صدقة جارية - من نهار - انكاء - دارفور</div>
</div>

<button onclick="make()" style="background:#27ae60;color:#fff">✨ تحديث الآية</button>
<button onclick="window.open('https://www.youtube.com/results?search_query=اسلام+صبحي+سورة+الإخلاص','_blank')" style="background:#FF0000;color:#fff">▶️ اسمع إسلام صبحي في يوتيوب</button>
<button onclick="shareIt()" style="background:#25D366;color:#fff">📤 واتساب</button>

<p style="color:#777;font-size:11px;margin:20px;line-height:1.6">كيف تعمل فيديو؟<br>1- افتح الموقع + افتح يوتيوب إسلام صبحي<br>2- اعمل تسجيل شاشة من تلفونك<br>3- ارفعو تيك توك - ده صدقة جارية</p>

<script>
const suras=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const ayat=["قُلْ هُوَ اللَّهُ أَحَدٌ","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","قُلْ أَعُوذُ بِرَبِّ النَّاسِ","بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنُ عَلَّمَ الْقُرْآنَ","تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ","إِنَّ مَعَ الْعُسْرِ يُسْرًا","وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا"];
let sel=document.getElementById('sura'); suras.forEach(s=>{let o=document.createElement('option');o.textContent="سورة "+s;sel.appendChild(o)}); sel.selectedIndex=111;
function make(){ document.getElementById('suraName').textContent=sel.value; document.getElementById('aya').innerHTML=ayat[Math.floor(Math.random()*ayat.length)]; document.getElementById('duaaShow').textContent=document.getElementById('duaa').value; }
function shareIt(){ let u=location.href; if(navigator.share){navigator.share({title:"صدقة جارية - نهار",url:u})}else{prompt("انسخ الرابط:",u)} }
document.getElementById('duaa').addEventListener('input',()=>document.getElementById('duaaShow').textContent=document.getElementById('duaa').value);
sel.addEventListener('change',make);
make();
</script>
</body>
</html>
